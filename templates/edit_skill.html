{% extends "base.html" %}
{% block content %}
<div class="container mt-5 pt-5 text-white">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-danger fw-bold">Modifier l'AC : {{ comp.code }}</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-light">Retour</a>
    </div>

    <form action="{{ url_for('edit_skill', id=comp.id) }}" method="POST" enctype="multipart/form-data" class="card bg-dark border-danger p-4">
        <div class="row">
            <div class="col-md-6">
                <label class="text-danger fw-bold">Code de l'AC</label>
                <input type="text" name="code" class="form-control bg-dark text-white border-secondary mb-3" value="{{ comp.code }}" required>
                
                <label class="text-danger fw-bold">Nom de l'AC</label>
                <input type="text" name="nom" class="form-control bg-dark text-white border-secondary mb-3" value="{{ comp.nom }}" required>
            </div>
            <div class="col-md-3">
                <label class="text-danger fw-bold">Bloc lié</label>
                <select name="bloc_id" class="form-select bg-dark text-white border-secondary mb-3">
                    {% for b in blocs %}
                    <option value="{{ b.id }}" {% if b.id == comp.bloc_id %}selected{% endif %}>{{ b.nom }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="text-danger fw-bold">Niveau</label>
                <select name="niveau" class="form-select bg-dark text-white border-secondary mb-3">
                    <option value="non acquis" {% if comp.niveau == 'non acquis' %}selected{% endif %}>Non acquis</option>
                    <option value="en cours" {% if comp.niveau == 'en cours' %}selected{% endif %}>En cours</option>
                    <option value="acquis" {% if comp.niveau == 'acquis' %}selected{% endif %}>Acquis</option>
                    <option value="expert" {% if comp.niveau == 'expert' %}selected{% endif %}>Expert</option>
                </select>
            </div>
        </div>

        <hr class="border-secondary">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="text-danger">Ce que j'ai fait</label>
                <textarea name="ce_que_jai_fait">{{ comp.ce_que_jai_fait }}</textarea>
            </div>
            <div class="col-md-6 mb-3">
                <label class="text-danger">Pourquoi je l'ai fait</label>
                <textarea name="pourquoi">{{ comp.pourquoi }}</textarea>
            </div>
            <div class="col-md-6 mb-3">
                <label class="text-danger">Comment je l'ai fait</label>
                <textarea name="comment">{{ comp.comment }}</textarea>
            </div>
            <div class="col-md-6 mb-3">
                <label class="text-danger">Mes difficultés</label>
                <textarea name="difficultes">{{ comp.difficultes }}</textarea>
            </div>
        </div>

        <hr class="border-secondary">
        <div class="row">
            <div class="col-md-6">
                <label class="text-danger">Modifier Image 1</label>
                <input type="file" name="image1" class="form-control bg-dark text-white border-secondary mb-2">
                {% if comp.image1 %}<small class="text-white-50">Actuel : {{ comp.image1 }}</small>{% endif %}
            </div>
            <div class="col-md-6">
                <label class="text-danger">Modifier Image 2</label>
                <input type="file" name="image2" class="form-control bg-dark text-white border-secondary mb-2">
                {% if comp.image2 %}<small class="text-white-50">Actuel : {{ comp.image2 }}</small>{% endif %}
            </div>
        </div>

        <button class="btn btn-success mt-4 py-2 fw-bold">ENREGISTRER LES MODIFICATIONS</button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
<script>
    tinymce.init({
        selector: 'textarea',
        plugins: 'lists link',
        toolbar: 'undo redo | bold italic | bullist numlist',
        menubar: false,
        skin: 'oxide-dark',
        content_css: 'dark',
        height: 200,
        branding: false
    });
</script>
{% endblock %}
