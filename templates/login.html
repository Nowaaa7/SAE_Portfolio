<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Admin</title>
</head>
<body style="background-color: #1a0000; color: white; text-align: center; padding-top: 50px;">
    
    <h2>Espace Administrateur</h2>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p style="color: yellow;">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Identifiant" required><br><br>
        <input type="password" name="password" placeholder="Mot de passe" required><br><br>
        <button type="submit" style="background-color: red; color: white; padding: 10px;">Se connecter</button>
    </form>

</body>
</html>
