<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  
  <title>{% block title %}Noa Jodry — Portfolio{% endblock %}</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}">
</head>
<body>

  <nav id="mainNavbar" class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Noa Jodry</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navCollapse">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navCollapse">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Accueil</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('cv') }}">CV</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('portfolio') }}">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('competences') }}">Compétences</a></li>
          
          <li class="nav-item ms-2">
            <button id="theme-toggle" class="btn btn-outline-light btn-sm" title="Changer de thème">
              <span id="icon-theme">☀️</span> 
            </button>
          </li>
          
          <li class="nav-item ms-2 d-none d-lg-block"><a class="btn btn-outline-light btn-sm" href="https://github.com/Nowaaa7" target="_blank">GitHub</a></li>
          <li class="nav-item ms-2 d-none d-lg-block"><a class="btn btn-primary btn-sm" href="https://www.linkedin.com/in/noa-jodry/" target="_blank">LinkedIn</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <nav>
    <a href="/">Accueil</a>
    <a href="/competences">Compétences</a>
    
    {% if current_user.is_authenticated %}
        <a href="/admin" style="color: lime;">⚙️ ADMIN</a>
        <a href="/logout">Déconnexion</a>
    {% else %}
        <a href="/login">Connexion</a>
    {% endif %}
  </nav>

  <main class="container py-5 mt-5">
    {% block content %}
    {% endblock %}
  </main>

  <footer class="site-footer text-center mt-5">
    <div class="container">
      <p class="mb-0 text-muted">© <span id="year"></span> Noa Jodry - Site à but personnel. | <a href="{{ url_for('mentions_legales') }}">Mentions légales & crédits</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='assets/js/main.js') }}"></script>
</body>
</html>
