version: '3.8'

services:
  # Serveur de Base de Données (PostgreSQL)
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password_secure
      POSTGRES_DB: db_portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Serveur HTTP (Ton application Flask)
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # URL de connexion à la base de données (utilise le nom du service 'db')
      - DATABASE_URL=postgresql://user_admin:password_secure@db:5432/db_portfolio
      - FLASK_APP=app.py
      - FLASK_DEBUG=0
    depends_on:
      - db

volumes:
  postgres_data: